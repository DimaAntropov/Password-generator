<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Генератор паролей</title>
<style>
/* --- Основные стили и анимация фона --- */
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center; /* Центрирование по вертикали */
  padding: 20px;       /* Отступы для мобильных устройств */
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  background: linear-gradient(135deg, #ff4b2b, #ff416c, #ff4b2b);
  background-size: 600% 600%;
  animation: gradientShift 15s ease infinite;
  box-sizing: border-box;
}

@keyframes gradientShift {
  0% {background-position: 0% 50%;}
  50% {background-position: 100% 50%;}
  100% {background-position: 0% 50%;}
}

/* --- Контейнер --- */
.container {
  background-color: #fff;
  padding: 2.5em;
  border-radius: 16px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  max-width: 480px;
  width: 100%;
  box-sizing: border-box;
  text-align: center;
}

/* --- Шапка (Приветствие + Выход) --- */
.header-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1.5em;
  padding-bottom: 1em;
  border-bottom: 1px solid #eee;
  font-size: 0.95em;
  color: #555;
}
.header-info b { color: #333; }
.btn-logout {
  color: #ff416c;
  text-decoration: none;
  font-weight: 600;
  border: 1px solid #ff416c;
  padding: 5px 10px;
  border-radius: 20px;
  transition: all 0.3s;
}
.btn-logout:hover {
  background-color: #ff416c;
  color: #fff;
}

h1 { margin-top: 0; color: #333; font-size: 1.8em; }

/* --- Форма --- */
form.main-form {
  display: flex;
  flex-direction: column;
  text-align: left;
}

label.main-label {
  margin-bottom: 0.5em;
  font-weight: 600;
  color: #444;
}

/* Поле длины */
input[type="number"] {
  padding: 0.8em;
  margin-bottom: 1.5em;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 1em;
  width: 100%;
  box-sizing: border-box;
}

/* Чекбоксы */
.checkbox-group {
  margin-bottom: 1.5em;
  display: flex;
  flex-direction: column;
  gap: 10px;
  background: #f9f9f9;
  padding: 15px;
  border-radius: 8px;
}
.checkbox-group label {
  display: flex;
  align-items: center;
  cursor: pointer;
  font-size: 0.95em;
  color: #555;
}
.checkbox-group input[type="checkbox"] {
  margin-right: 10px;
  width: 18px;
  height: 18px;
  accent-color: #ff416c;
  cursor: pointer;
}

/* Кнопка "Сгенерировать" */
input[type="submit"] {
  padding: 1em;
  border: none;
  border-radius: 8px;
  background: linear-gradient(135deg, #ff416c, #ff4b2b);
  color: #fff;
  font-size: 1.1em;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  width: 100%;
}
input[type="submit"]:hover {
  transform: translateY(-2px);
  box-shadow: 0 5px 15px rgba(255, 65, 108, 0.4);
}

/* --- Блок результата (Текущий пароль) --- */
.result {
  margin-top: 2em;
  padding: 1.5em;
  background-color: #ffe0e0;
  border-radius: 12px;
  border: 1px solid #ffcaca;
  position: relative;
}
.result p { margin: 0 0 10px 0; color: #555; font-size: 0.9em; }
.result code {
  display: block;
  font-size: 1.6em;
  font-weight: bold;
  word-break: break-all;
  color: #d63031;
  font-family: 'Courier New', Courier, monospace;
  margin-bottom: 10px;
}
.btn-copy-main {
  background: #fff;
  border: 1px solid #d63031;
  color: #d63031;
  padding: 5px 12px;
  border-radius: 4px;
  cursor: pointer;
  font-weight: bold;
  font-size: 0.9em;
}
.btn-copy-main:hover { background: #d63031; color: #fff; }

/* --- Блок Истории --- */
.history-section {
  margin-top: 30px;
  border-top: 2px dashed #eee;
  padding-top: 20px;
  text-align: left;
}
.history-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.history-header h3 {
  margin: 0;
  font-size: 1em;
  color: #777;
  text-transform: uppercase;
}
.btn-clear {
  background: none;
  border: none;
  color: #999;
  text-decoration: underline;
  cursor: pointer;
  font-size: 0.85em;
}
.btn-clear:hover { color: #d63031; }

.history-list {
  list-style: none;
  padding: 0;
  margin: 0;
}
.history-list li {
  padding: 8px 10px;
  border-bottom: 1px solid #f0f0f0;
  font-family: 'Courier New', Courier, monospace;
  font-size: 1.1em;
  color: #333;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.history-list li:last-child { border-bottom: none; }
/* Подсветка первого элемента (самого свежего) */
.history-list li:first-child {
  background-color: #fff0f0;
  border-radius: 6px;
  font-weight: bold;
}

</style>
</head>
<body>

<div class="container">
  <!-- Шапка -->
  <div class="header-info">
    <span>Пользователь: <b>{{ username }}</b></span>
    <a href="{{ url_for('logout') }}" class="btn-logout">Выйти</a>
  </div>

  <h1>Генератор</h1>

  <!-- Сообщения об ошибках -->
  {% if error %}
    <div style="color: #d63031; background: #ffdcdc; padding: 10px; border-radius: 6px; margin-bottom: 15px;">
      {{ error }}
    </div>
  {% endif %}

  <!-- Форма настроек -->
  <form action="/" method="post" class="main-form">
    <label class="main-label" for="length">Длина пароля:</label>
    <input type="number" id="length" name="length" value="{{ length }}" min="4" max="128" required />

    <div class="checkbox-group">
      <label><input type="checkbox" name="lowercase" {% if use_lowercase %}checked{% endif %}> Строчные буквы (a-z)</label>
      <label><input type="checkbox" name="uppercase" {% if use_uppercase %}checked{% endif %}> Прописные буквы (A-Z)</label>
      <label><input type="checkbox" name="digits" {% if use_digits %}checked{% endif %}> Цифры (0-9)</label>
      <label><input type="checkbox" name="symbols" {% if use_symbols %}checked{% endif %}> Спецсимволы (!@#$)</label>
    </div>

    <input type="submit" value="Сгенерировать пароль" />
  </form>

  <!-- Результат генерации -->
  {% if password %}
  <div class="result">
    <p>Ваш новый пароль:</p>
    <code id="current-password">{{ password }}</code>
    <button class="btn-copy-main" onclick="copyMainPassword()">Копировать</button>
  </div>
  {% endif %}

  <!-- История паролей -->
  {% if history %}
  <div class="history-section">
    <div class="history-header">
      <h3>История сессии</h3>
      <form action="/" method="post" style="display:inline;">
        <button type="submit" name="clear_history" class="btn-clear">Очистить</button>
      </form>
    </div>
    <ul class="history-list">
      {% for item in history %}
        <li>
            <span>{{ item }}</span>
            <!-- Маленькая иконка копирования для истории -->
            <span style="cursor:pointer; opacity:0.5;" onclick="copyText('{{ item }}')" title="Копировать">📋</span>
        </li>
      {% endfor %}
    </ul>
  </div>
  {% endif %}

</div>

<script>
  // Функция копирования основного пароля
  function copyMainPassword() {
    const pwd = document.getElementById('current-password').innerText;
    copyText(pwd);
  }

  // Универсальная функция копирования
  function copyText(text) {
    navigator.clipboard.writeText(text).then(() => {
      alert("Пароль скопирован: " + text);
    }).catch(err => {
      console.error('Ошибка копирования: ', err);
    });
  }
</script>

</body>
</html>
