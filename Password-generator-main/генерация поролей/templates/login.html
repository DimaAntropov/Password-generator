<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Вход</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #ff7e5f, #feb47b, #86a8e7);
  background-size: 600% 600%;
  animation: gradientAnimation 15s ease infinite;
  padding: 20px;
  box-sizing: border-box;
}

@keyframes gradientAnimation {
  0% {background-position: 0% 50%;}
  50% {background-position: 100% 50%;}
  100% {background-position: 0% 50%;}
}

.container {
  background: #fff;
  padding: 35px 30px;
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  max-width: 400px;
  width: 100%;
  text-align: center;
}

h1 { margin: 0 0 20px 0; color: #333; }

.error {
  background-color: #ffe0e0;
  color: #d9534f;
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 20px;
  border: 1px solid #f5c6cb;
}

form.login-form {
  display: flex;
  flex-direction: column;
  text-align: left;
}

label { margin-bottom: 5px; font-weight: 600; color: #555; }

input[type="text"],
input[type="password"] {
  padding: 12px;
  margin-bottom: 20px;
  border: 2px solid #ddd;
  border-radius: 8px;
  font-size: 1em;
}
input:focus { border-color: #66a6ff; outline: none; }

input[type="submit"] {
  padding: 12px;
  background: linear-gradient(135deg, #66a6ff, #89f7fe);
  border: none;
  border-radius: 8px;
  font-size: 1.1em;
  font-weight: 600;
  color: #fff;
  cursor: pointer;
  transition: transform 0.2s;
}
input[type="submit"]:hover { transform: translateY(-2px); }

.btn-register {
  display: block;
  margin-top: 15px;
  padding: 12px;
  background-color: #f0f2f5;
  color: #333;
  text-decoration: none;
  border-radius: 8px;
  font-weight: 600;
}
.btn-register:hover { background-color: #e4e6eb; }

/* --- Стили для ИСТОРИИ --- */
.history-box {
  margin-top: 30px;
  border-top: 2px dashed #eee;
  padding-top: 15px;
  text-align: left;
}
.history-title {
  font-size: 0.9em;
  color: #888;
  font-weight: bold;
  text-transform: uppercase;
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
}
.btn-clear {
  background: none;
  border: none;
  color: #d9534f;
  cursor: pointer;
  font-size: 0.85em;
  text-decoration: underline;
}

.history-list {
  list-style: none;
  padding: 0;
  margin: 0;
}
.history-item {
  background-color: #f9f9f9;
  border: 1px solid #eee;
  margin-bottom: 8px;
  padding: 8px 10px;
  border-radius: 6px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.pwd-text {
  font-family: monospace;
  font-weight: bold;
  color: #333;
  font-size: 1.1em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin-right: 10px;
}
.btn-use {
  background-color: #28a745;
  color: white;
  border: none;
  border-radius: 4px;
  padding: 4px 8px;
  font-size: 0.8em;
  cursor: pointer;
}
.btn-use:hover { background-color: #218838; }

</style>
</head>
<body>
<div class="container">
  <h1>Вход</h1>

  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}

  <!-- Форма входа -->
  <form method="post" class="login-form">
    <label for="username">Логин</label>
    <input type="text" id="username" name="username" placeholder="Введите логин" required />

    <label for="password">Пароль</label>
    <input type="password" id="password" name="password" placeholder="Введите пароль" required />

    <input type="submit" value="Войти" />
  </form>

  <a href="{{ url_for('register') }}" class="btn-register">Зарегистрироваться</a>

  <!-- БЛОК ИСТОРИИ ПАРОЛЕЙ -->
  {% if history %}
  <div class="history-box">
    <div class="history-title">
      <span>Ваши пароли (из сессии)</span>
      <form method="post" style="display:inline;">
        <button type="submit" name="clear_history" class="btn-clear">Очистить</button>
      </form>
    </div>

    <ul class="history-list">
      {% for pwd in history %}
      <li class="history-item">
        <span class="pwd-text">{{ pwd }}</span>
        <!-- Кнопка для вставки пароля в поле -->
        <button type="button" class="btn-use" onclick="fillPassword('{{ pwd }}')">Вставить</button>
      </li>
      {% endfor %}
    </ul>
  </div>
  {% endif %}

  <div style="margin-top: 20px; font-size:0.8em; color:#777;">
    (Тест: <b>Танк</b> / <b>Железный</b>)
  </div>

</div>

<script>
  // Скрипт для вставки пароля
  function fillPassword(password) {
    const passwordField = document.getElementById('password');
    passwordField.value = password;
    // Эффект подсветки поля
    passwordField.style.borderColor = '#28a745';
    setTimeout(() => {
      passwordField.style.borderColor = '#ddd';
    }, 500);
  }
</script>

</body>
</html>
