<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Вход</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #ff7e5f, #feb47b, #86a8e7);
  background-size: 600% 600%;
  animation: gradientAnimation 15s ease infinite;
  padding: 20px;
  box-sizing: border-box;
}

@keyframes gradientAnimation {
  0% {background-position: 0% 50%;}
  50% {background-position: 100% 50%;}
  100% {background-position: 0% 50%;}
}

.container {
  background: #fff;
  padding: 35px 30px;
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  max-width: 400px;
  width: 100%;
  text-align: center;
}

h1 { margin: 0 0 20px 0; color: #333; }

.error {
  background-color: #ffe0e0;
  color: #d9534f;
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 20px;
  border: 1px solid #f5c6cb;
}

form.login-form {
  display: flex;
  flex-direction: column;
  text-align: left;
}

label { margin-bottom: 5px; font-weight: 600; color: #555; }

input[type="text"],
input[type="password"] {
  padding: 12px;
  margin-bottom: 20px;
  border: 2px solid #ddd;
  border-radius: 8px;
  font-size: 1em;
}
input:focus { border-color: #66a6ff; outline: none; }

input[type="submit"] {
  padding: 12px;
  background: linear-gradient(135deg, #66a6ff, #89f7fe);
  border: none;
  border-radius: 8px;
  font-size: 1.1em;
  font-weight: 600;
  color: #fff;
  cursor: pointer;
  transition: transform 0.2s;
}
input[type="submit"]:hover { transform: translateY(-2px); }

.btn-register {
  display: block;
  margin-top: 15px;
  padding: 12px;
  background-color: #f0f25;
  color: #333;
  text-decoration: none;
  border-radius: 8px;
  font-weight: 600;
}
.btn-register:hover { background-color: #e4e6eb; }
</style>
</head>
<body>
<div class="container">
  <h1>Вход</h1>

  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}

  <!-- Форма входа -->
  <form method="post" class="login-form">
    <label for="username">Логин</label>
    <input type="text" id="username" name="username" placeholder="Введите логин" required />

    <label for="password">Пароль</label>
    <input type="password" id="password" name="password" placeholder="Введите пароль" required />

    <input type="submit" value="Войти" />
  </form>

  <a href="{{ url_for('register') }}" class="btn-register">Зарегистрироваться</a>

  <div style="margin-top: 20px; font-size:0.8em; color:#777;">
    (Тест: <b>Танк</b> / <b>Железный</b>)
  </div>

</div>
</body>
</html>
