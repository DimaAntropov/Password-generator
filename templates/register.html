<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Регистрация</title>

<style>
/* Весь ваш стиль из index.html или login.html, чтобы сохранить дизайн */
body {
  margin: 0;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #ff7e5f, #feb47b, #86a8e7);
  background-size: 600% 600%;
  animation: gradientAnimation 15s ease infinite;
}
@keyframes gradientAnimation {
  0% {background-position: 0% 50%;}
  50% {background-position: 100% 50%;}
  100% {background-position: 0% 50%;}
}
.container {
  background: #fff;
  padding: 35px 30px;
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  max-width: 400px;
  width: 90%;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  text-align: center;
}
h1 {
  margin-top: 0;
  margin-bottom: 20px;
  font-size: 2.2em;
  color: #222;
  font-weight: 600;
  text-align: center;
}
.error {
  background-color: #ffe0e0;
  color: #d9534f;
  padding: 12px;
  border-radius: 12px;
  margin-bottom: 20px;
  font-size: 0.95em;
  border: 1px solid #f5c6cb;
  box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  text-align: center;
}
input[type="text"],
input[type="password"],
input[type="email"] {
  width: 100%;
  padding: 14px;
  margin-bottom: 20px;
  border: 2px solid #ddd;
  border-radius: 12px;
  font-size: 1em;
  transition: border-color 0.3s, box-shadow 0.3s;
}
input[type="text"]:focus,
input[type="password"]:focus,
input[type="email"]:focus {
  border-color: #66a6ff;
  box-shadow: 0 0 8px rgba(102, 166, 255, 0.3);
}
input[type="submit"] {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #66a6ff, #89f7fe);
  border: none;
  border-radius: 12px;
  font-size: 1.1em;
  font-weight: 600;
  color: #fff;
  cursor: pointer;
  transition: background 0.3s, transform 0.2s;
}
input[type="submit"]:hover {
  background: linear-gradient(135deg, #89f7fe, #66a6ff);
  transform: translateY(-2px);
}
.hint {
  margin-top: 20px;
  font-size: 0.9em;
  color: #555;
}
@media(max-width: 500px) {
  .container {
    padding: 30px 20px;
  }
}
</style>
</head>
<body>
<div class="container">
  <h1>Регистрация</h1>
  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}
  <form method="post">
    <label for="username">Логин</label>
    <input type="text" id="username" name="username" placeholder="Введите логин" required />

    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="Введите email" required />

    <label for="password">Пароль</label>
    <input type="password" id="password" name="password" placeholder="Введите пароль" required />

    <label for="confirm_password">Подтверждение пароля</label>
    <input type="password" id="confirm_password" name="confirm_password" placeholder="Повторите пароль" required />

    <input type="submit" value="Зарегистрироваться" />
  </form>
  <div class="hint">
    <small>Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a></small>
  </div>
</div>
</body>
</html>
