<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Генератор паролей</title>
<style>
  /* Красный градиентный фон с анимацией */
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  background: linear-gradient(135deg, #ff4b2b, #ff416c, #ff4b2b);
  background-size: 600% 600%;
  animation: gradientShift 15s ease infinite;
}

/* Анимация градиента */
@keyframes gradientShift {
  0% {background-position: 0% 50%;}
  50% {background-position: 100% 50%;}
  100% {background-position: 0% 50%;}
}

/* Контейнер */
.container {
  background-color: #fff;
  padding: 2.5em;
  border-radius: 12px;
  box-shadow: 0 8px 16px rgba(0,0,0,0.1);
  max-width: 450px;
  width: 90%;
  box-sizing: border-box;
  text-align: center;
}

/* Заголовок */
h1 {
  margin-top: 0;
  margin-bottom: 20px;
  font-size: 1.8em;
  color: #222;
  text-align: center;
}

/* Блок приветствия и выхода */
.header-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1.5em;
  padding-bottom: 1em;
  border-bottom: 1px solid #ddd;
  font-size: 0.9em;
}

.header-info p {
  margin: 0;
  color: #555;
}
.header-info a {
  color: #007bff;
  text-decoration: none;
  font-weight: 600;
  transition: color 0.2s;
}
.header-info a:hover {
  color: #ff4b2b; /* яркий цвет при наведении */
}

/* Форма */
form {
  display: flex;
  flex-direction: column;
}
label {
  margin-bottom: 0.3em;
  font-weight: 600;
  color: #333;
}
input[type="number"],
input[type="text"],
input[type="password"] {
  padding: 0.75em 1em;
  margin-bottom: 1.2em;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 1em;
  transition: border-color 0.2s;
}
input[type="number"]:focus,
input[type="text"]:focus,
input[type="password"]:focus {
  border-color: #ff416c;
  outline: none;
  box-shadow: 0 0 8px rgba(255,65,108,0.3);
}
/* Кнопка */
input[type="submit"] {
  padding: 0.9em;
  border: none;
  border-radius: 8px;
  background: linear-gradient(135deg, #ff416c, #ff4b2b);
  color: #fff;
  font-size: 1.05em;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.3s, transform 0.2s;
}
input[type="submit"]:hover {
  background: linear-gradient(135deg, #ff4b2b, #ff416c);
  transform: translateY(-1px);
}
/* Блок результата */
.result {
  margin-top: 2em;
  padding: 1em;
  background-color: #ffe0e0;
  border-radius: 10px;
  font-family: 'Courier New', Courier, monospace;
  font-size: 1.2em;
  word-break: break-word;
  text-align: center;
  color: #222;
}
/* Адаптив */
@media(max-width: 500px){
  .container {
    padding: 2em;
  }
}
</style>
</head>
<body>
<div class="container">
  {% if session.logged_in %}
  <div class="header-info">
    <p>Привет, <b>{{ username }}</b>!</p>
    <a href="{{ url_for('logout') }}">Выход</a>
  </div>
  {% endif %}

  <h1>Генератор паролей</h1>

  <form action="/" method="post">
    <label for="length">Длина пароля:</label>
    <input type="number" id="length" name="length" value="{{ length }}" min="4" max="128" required />

    <div class="checkbox-group">
      <label><input type="checkbox" name="lowercase" {% if use_lowercase %}checked{% endif %}> Строчные буквы (a-z)</label>
      <label><input type="checkbox" name="uppercase" {% if use_uppercase %}checked{% endif %}> Прописные буквы (A-Z)</label>
      <label><input type="checkbox" name="digits" {% if use_digits %}checked{% endif %}> Цифры (0-9)</label>
      <label><input type="checkbox" name="symbols" {% if use_symbols %}checked{% endif %}> Спецсимволы (!@#$...)</label>
    </div>

    <input type="submit" value="Сгенерировать" />
  </form>

  {% if password %}
  <div class="result">
    <p>Ваш пароль:</p>
    <code>{{ password }}</code>
  </div>
  {% endif %}
</div>
</body>
</html>
